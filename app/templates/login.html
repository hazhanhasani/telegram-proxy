<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ورود | {{ app_name }}</title><link rel="stylesheet" href="{{ url_for('static', path='app.css') }}"></head>
<body class="login-body"><section class="login-card"><div class="brand center"><div class="brand-mark">TP</div><div><strong>Telegram Proxy</strong><small>Control Center</small></div></div><div class="login-copy"><div class="eyebrow">Secure Admin Access</div><h1>ورود به پنل مدیریت</h1><p>مدیریت سرورها، MTProto Proxyها و اسپانسرها از یک نقطه.</p></div>
